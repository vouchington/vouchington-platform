version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
      exclude:
        - '@jongleberry/*'
        - '@vouchington/*'
        - pr-shepherd
        - valkyries
    open-pull-requests-limit: 5
    groups:
      first-party:
        applies-to: version-updates
        patterns:
          - '@jongleberry/*'
          - '@vouchington/*'
          - pr-shepherd
          - valkyries
      typescript-toolchain:
        applies-to: version-updates
        patterns:
          - '@types/node'
          - typescript
      vitest:
        applies-to: version-updates
        patterns:
          - '@vitest/coverage-v8'
          - vitest
      vitest-security:
        applies-to: security-updates
        patterns:
          - '@vitest/coverage-v8'
          - vitest
      oxc-toolchain:
        applies-to: version-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      oxc-toolchain-security:
        applies-to: security-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
