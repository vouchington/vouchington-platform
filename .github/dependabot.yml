version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
      exclude:
        - '@jongleberry/*'
        - '@vouchington/*'
        - pr-shepherd
        - valkyries
    open-pull-requests-limit: 5
    groups:
      first-party:
        applies-to: version-updates
        patterns:
          - '@jongleberry/*'
          - '@vouchington/*'
          - pr-shepherd
          - valkyries
      typescript-toolchain:
        applies-to: version-updates
        patterns:
          - '@types/node'
          - typescript
      vitest:
        applies-to: version-updates
        patterns:
          - '@vitest/coverage-v8'
          - vitest
      vitest-security:
        applies-to: security-updates
        patterns:
          - '@vitest/coverage-v8'
          - vitest
      oxc-toolchain:
        applies-to: version-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      oxc-toolchain-security:
        applies-to: security-updates
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
      aws-sdk:
        applies-to: version-updates
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      aws-sdk-security:
        applies-to: security-updates
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      atproto:
        applies-to: version-updates
        patterns:
          - '@atproto/*'
          - '@atproto-labs/*'
      react:
        applies-to: version-updates
        patterns:
          - '@types/react'
          - '@types/react-dom'
          - react
          - react-dom
      react-email:
        applies-to: version-updates
        patterns:
          - '@react-email/*'
          - react-email
      testing-library:
        applies-to: version-updates
        patterns:
          - '@testing-library/*'
      pg:
        applies-to: version-updates
        patterns:
          - '@types/pg'
          - '@types/pg-cursor'
          - pg
          - pg-cursor
      ajv:
        applies-to: version-updates
        patterns:
          - ajv
          - ajv-formats
      csv:
        applies-to: version-updates
        patterns:
          - csv-parse
          - csv-stringify
      sentry:
        applies-to: version-updates
        patterns:
          - '@sentry/*'
      sentry-security:
        applies-to: security-updates
        patterns:
          - '@sentry/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
