version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - '@jongleberry/api-server'
        - '@jongleberry/vurst-html'
        - '@vouchington/crawler-html'
        - '@vouchington/http-transport'
        - '@vouchington/rss-parser'
        - '@vouchington/uuid-v7'
        - pr-shepherd
        - valkyries
    open-pull-requests-limit: 5
    groups:
      first-party-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '@jongleberry/api-server'
          - '@jongleberry/vurst-html'
          - '@vouchington/crawler-html'
          - '@vouchington/http-transport'
          - '@vouchington/rss-parser'
          - '@vouchington/uuid-v7'
          - pr-shepherd
          - valkyries
        update-types:
          - minor
          - patch
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
