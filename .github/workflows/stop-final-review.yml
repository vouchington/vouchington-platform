name: Stop Final Review

on:
  pull_request_target:
    types: [converted_to_draft, closed]

permissions: {}

concurrency:
  group: final-code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  clear:
    if: >-
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Clear final-review lifecycle labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for label in final-code-review:requested final-code-review:complete; do
            encoded="$(jq -rn --arg value "$label" '$value | @uri')"
            status=0
            error_file="$(mktemp "${RUNNER_TEMP}/label-delete.XXXXXX")"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${encoded}" \
              --silent 2>"$error_file" || status=$?
            if [ "$status" -ne 0 ] && ! grep -q 'HTTP 404' "$error_file"; then
              cat "$error_file" >&2
              rm -f "$error_file"
              exit "$status"
            fi
            rm -f "$error_file"
          done
