name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        default: '@vouchington/postgres'
        options:
          - '@vouchington/auth'
          - '@vouchington/postgres'
          - '@vouchington/utils'
          - '@vouchington/session-jwt'
          - '@vouchington/queue-errors'
          - '@vouchington/worker-runtime'
          - '@vouchington/pagination'
          - '@vouchington/crawler-html'
          - '@vouchington/embeds'
          - '@vouchington/rss-parser'
          - '@vouchington/rss-crawler'
          - '@vouchington/robots'
          - '@vouchington/browser-crawl'
          - '@vouchington/domain-verification'
          - '@vouchington/csv'
          - '@vouchington/html-utils'
          - '@vouchington/phone-validation'
          - '@vouchington/uuid-v7'
          - '@vouchington/frontmatter'
          - '@vouchington/localization'
          - '@vouchington/localization-compiler'
          - '@vouchington/http-transport'
          - '@vouchington/image-resize'
          - '@vouchington/media'
          - '@vouchington/wikimedia'
          - '@vouchington/memberships'
          - '@vouchington/typed-entities'
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      release_line:
        description: Published source line
        type: choice
        required: true
        default: main
        options:
          - main
          - legacy-localization-compiler-0.0

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # knip's oxc-parser OOMs on ubuntu-slim; match the CI test job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. It needs Contents Read & Write on this repository." >&2
          exit 1
          fi

      - name: Validate release line
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGE: ${{ inputs.package }}
          RELEASE_LINE: ${{ inputs.release_line }}
        run: |
          case "$RELEASE_LINE" in
            main|legacy-localization-compiler-0.0) ;;
            *)
              echo "::error::Unsupported release line: $RELEASE_LINE" >&2
              exit 1
              ;;
          esac
          if [ "$RELEASE_LINE" != main ] && { [ "$PACKAGE" != '@vouchington/localization-compiler' ] || [ "$BUMP" != patch ]; }; then
            echo "::error::Maintenance releases only support @vouchington/localization-compiler patch releases" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: false

      - name: Prepare reviewed legacy compiler source
        if: inputs.release_line == 'legacy-localization-compiler-0.0'
        env:
          LEGACY_BASE_TAG: localization-compiler-v0.0.3
          LEGACY_BASE_SHA: 8b74473ff4804fa6a81dbbab1d55a96c4a31d7b4
          LEGACY_PATCH: releases/localization-compiler/0.0.4.patch
          LEGACY_PATCH_SHA256: 29ba30aef8e727601ec47da856b3a12817ddefeb1f6eb3f73c7e271dd312070a
          LEGACY_RELEASE_BRANCH: release/localization-compiler-0.0.4
        run: |
          PATCH_FILE="$RUNNER_TEMP/localization-compiler-0.0.4.patch"
          git show "$GITHUB_SHA:$LEGACY_PATCH" > "$PATCH_FILE"
          echo "$LEGACY_PATCH_SHA256  $PATCH_FILE" | sha256sum --check --status
          if git ls-remote --exit-code origin "refs/heads/$LEGACY_RELEASE_BRANCH" > /dev/null; then
            git fetch origin "refs/heads/$LEGACY_RELEASE_BRANCH:refs/remotes/origin/$LEGACY_RELEASE_BRANCH"
            git checkout --detach "origin/$LEGACY_RELEASE_BRANCH"
            if git apply --reverse --check "$PATCH_FILE"; then
              exit 0
            fi
            test "$(git rev-parse HEAD)" = "$LEGACY_BASE_SHA"
          fi
          test "$(git rev-parse "$LEGACY_BASE_TAG^{}")" = "$LEGACY_BASE_SHA"
          git checkout --detach "$LEGACY_BASE_SHA"
          git apply --check "$PATCH_FILE"
          git apply --index "$PATCH_FILE"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - name: Prepare release plan
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: >-
          node scripts/release.mts prepare "$PACKAGE" "$BUMP"
          "$RUNNER_TEMP/release-plan.json" ".github/release-plan.json"
      - run: pnpm install --lockfile-only
      - run: pnpm exec oxfmt .github/release-plan.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run actionlint

      - name: Verify published runtime dependencies
        run: node scripts/release.mts verify "$RUNNER_TEMP/release-plan.json"

      - name: Dry-run planned packages
        run: node scripts/release.mts pack "$RUNNER_TEMP/release-plan.json"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag release plan
        run: |
          if [ "$(node scripts/release.mts is-resume "$RUNNER_TEMP/release-plan.json")" = "true" ]; then
            exit 0
          fi
          PACKAGE=$(node scripts/release.mts selected-package "$RUNNER_TEMP/release-plan.json")
          VERSION=$(node scripts/release.mts selected-version "$RUNNER_TEMP/release-plan.json")
          SUMMARY=$(node scripts/release.mts summary "$RUNNER_TEMP/release-plan.json")
          git add packages/*/package.json pnpm-lock.yaml .github/release-plan.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${PACKAGE} v${VERSION}" -m "$SUMMARY"
          fi
          node scripts/release.mts tag "$RUNNER_TEMP/release-plan.json"

      - name: Push release commit and tags
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_LINE: ${{ inputs.release_line }}
        run: |
          if [ "$RELEASE_LINE" = legacy-localization-compiler-0.0 ]; then
            RELEASE_BRANCH=release/localization-compiler-0.0.4
          else
            RELEASE_BRANCH=main
          fi
          if [ "$(node scripts/release.mts is-resume "$RUNNER_TEMP/release-plan.json")" = "false" ]; then
            git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" --follow-tags
          fi

      - name: Publish planned packages with npm OIDC
        run: node scripts/release.mts publish "$RUNNER_TEMP/release-plan.json"

      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/release.mts github-release "$RUNNER_TEMP/release-plan.json"
