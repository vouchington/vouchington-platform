name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        default: '@vouchington/postgres'
        options:
          - '@vouchington/postgres'
          - '@vouchington/utils'
          - '@vouchington/session-jwt'
          - '@vouchington/queue-errors'
          - '@vouchington/pagination'
          - '@vouchington/crawler-html'
          - '@vouchington/rss-parser'
          - '@vouchington/rss-crawler'
          - '@vouchington/robots'
          - '@vouchington/browser-crawl'
          - '@vouchington/domain-verification'
          - '@vouchington/csv'
          - '@vouchington/html-utils'
          - '@vouchington/phone-validation'
          - '@vouchington/uuid-v7'
          - '@vouchington/frontmatter'
          - '@vouchington/http-transport'
          - '@vouchington/image-resize'
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # knip's oxc-parser OOMs on ubuntu-slim; match the CI test job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret is not set. It needs Contents Read & Write on this repository." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.22.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run actionlint

      - name: Verify published runtime dependencies
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync, readdirSync } = require('node:fs')
          const directory = readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .find((entry) => JSON.parse(readFileSync(`packages/${entry.name}/package.json`, 'utf8')).name === process.env.PACKAGE)
          if (!directory) throw new Error(`Unknown package ${process.env.PACKAGE}`)
          const manifest = JSON.parse(readFileSync(`packages/${directory.name}/package.json`, 'utf8'))
          for (const [name, range] of Object.entries(manifest.dependencies ?? {})) {
            if (!name.startsWith('@vouchington/')) continue
            execFileSync('npm', ['view', `${name}@${range}`, 'version'], { stdio: 'inherit' })
          }
          NODE

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, tag
        id: bump
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          DIRECTORY=$(node -p "require('node:fs').readdirSync('packages', { withFileTypes: true }).filter(entry => entry.isDirectory()).find(entry => JSON.parse(require('node:fs').readFileSync('packages/' + entry.name + '/package.json', 'utf8')).name === process.env.PACKAGE)?.name ?? ''")
          if [ -z "$DIRECTORY" ]; then
            echo "::error::Unknown package $PACKAGE" >&2
            exit 1
          fi
          pnpm --filter "$PACKAGE" version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./packages/${DIRECTORY}/package.json').version")
          git add "packages/${DIRECTORY}/package.json" pnpm-lock.yaml
          git commit -m "chore(release): ${PACKAGE} v${VERSION}"
          git tag -a "${DIRECTORY}-v${VERSION}" -m "${PACKAGE} v${VERSION}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: git push origin HEAD:main --follow-tags

      - name: Publish with npm OIDC
        working-directory: packages/${{ steps.bump.outputs.directory }}
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.directory }}-v${{ steps.bump.outputs.version }}" \
            --title "${{ inputs.package }} v${{ steps.bump.outputs.version }}" \
            --generate-notes
