name: Final Code Review

on:
  # This workflow is defined on the default branch and runs for every PR head commit.
  # pull_request_target is intentional: the workflow definition and action references are
  # trusted, while the PR checkout is restricted to the trusted same-repository path below.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  # Never cancel an older SHA's gate. Each PR head gets its own native check, and the gate
  # itself rejects a stale head before it can report success for the current PR.
  group: final-code-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  await-required-tests:
    name: Await required tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for required checks on this exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::The pull request head is not a full commit SHA.'
            exit 1
          }

          current_head="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current_head" = "$HEAD_SHA" ] || {
            echo "::error::PR #$PR_NUMBER moved from $HEAD_SHA to $current_head before test polling began."
            exit 1
          }

          # Check-runs are read from the commit endpoint and filtered by both exact head SHA and
          # the GitHub Actions app. A check from another commit or integration cannot satisfy this
          # gate. Polling is necessary because pull_request_target starts alongside CI.
          ci_workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows" --jq '
            [.workflows[] | select(.path == ".github/workflows/ci.yml")] | first | .id // empty
          ')"
          [ -n "$ci_workflow_id" ] || {
            echo '::error::The trusted CI workflow could not be identified.'
            exit 1
          }

          find_check() {
            local check_name="$1"
            local check_id details_url run_id run_json
            while IFS= read -r check_id; do
              [ -n "$check_id" ] || continue
              details_url="$(jq -r --argjson id "$check_id" \
                '.check_runs[] | select(.id == $id) | .details_url' <<< "$checks")"
              run_id="$(sed -nE 's#^.*/actions/runs/([0-9]+)/job/[0-9]+$#\1#p' <<< "$details_url")"
              [ -n "$run_id" ] || continue
              run_json="$(gh api "repos/$REPOSITORY/actions/runs/$run_id")" || continue
              if jq -e \
                --argjson workflow_id "$ci_workflow_id" \
                --arg sha "$HEAD_SHA" \
                --argjson pr "$PR_NUMBER" \
                '.workflow_id == $workflow_id and
                 .path == ".github/workflows/ci.yml" and
                 .event == "pull_request" and
                 .head_sha == $sha and
                 any(.pull_requests[]?; .number == $pr)' \
                <<< "$run_json" >/dev/null; then
                jq -c --argjson id "$check_id" '.check_runs[] | select(.id == $id)' <<< "$checks"
                return 0
              fi
            done < <(jq -r --arg name "$check_name" --arg sha "$HEAD_SHA" '
              [.check_runs[] | select(.name == $name and .head_sha == $sha and .app.slug == "github-actions")]
              | sort_by(.id) | reverse | .[].id
            ' <<< "$checks")
            return 1
          }

          deadline=$((SECONDS + 2400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            current_head="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)"
            [ "$current_head" = "$HEAD_SHA" ] || {
              echo "::error::PR #$PR_NUMBER moved from $HEAD_SHA to $current_head while tests were running."
              exit 1
            }

            checks="$(gh api --paginate "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs[]' | jq -s '{check_runs: .}')"
            pending=false
            failed=false
            for check_name in test actionlint; do
              check="$(find_check "$check_name")" || check=''
              if [ -z "$check" ]; then
                pending=true
                echo "$check_name: not reported yet"
                continue
              fi
              status="$(jq -r .status <<< "$check")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$check")"
              echo "$check_name: status=$status conclusion=${conclusion:-pending}"
              if [ "$status" != completed ]; then
                pending=true
              elif [ "$conclusion" != success ]; then
                failed=true
                echo "::error::$check_name for $HEAD_SHA concluded $conclusion."
              fi
            done

            if [ "$failed" = true ]; then
              exit 1
            fi
            if [ "$pending" = false ]; then
              echo "All required checks passed for PR #$PR_NUMBER at $HEAD_SHA."
              exit 0
            fi
            sleep 15
          done

          echo "::error::Timed out waiting for test and actionlint on $HEAD_SHA."
          exit 1

  validate-review-settings:
    name: Validate review settings
    needs: [await-required-tests]
    if: >-
      needs.await-required-tests.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'app/dependabot' &&
      github.event.pull_request.user.login != 'renovate' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'app/renovate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Validate provider configuration
        env:
          OPENROUTER_ENABLED: ${{ vars.OPENCODE_CODE_REVIEW_ENABLED }}
          OPENROUTER_MODEL: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          ZEN_ENABLED: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED }}
          ZEN_MODEL: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          boolean() {
            case "$2" in
              true|false) ;;
              *) echo "::error::$1 must be exactly true or false."; exit 1 ;;
            esac
          }
          boolean OPENCODE_CODE_REVIEW_ENABLED "$OPENROUTER_ENABLED"
          boolean OPENCODE_ZEN_CODE_REVIEW_ENABLED "$ZEN_ENABLED"
          if [ "$OPENROUTER_ENABLED" = true ] && [ -z "$OPENROUTER_MODEL" ]; then
            echo '::error::OPENCODE_CODE_REVIEW_MODEL is required when OpenRouter review is enabled.'
            exit 1
          fi
          if [ "$ZEN_ENABLED" = true ] && [ -z "$ZEN_MODEL" ]; then
            echo '::error::OPENCODE_ZEN_CODE_REVIEW_MODEL is required when OpenCode Zen review is enabled.'
            exit 1
          fi

  opencode-openrouter-review:
    name: OpenCode OpenRouter review
    needs: [await-required-tests, validate-review-settings]
    if: >-
      needs.await-required-tests.result == 'success' &&
      needs.validate-review-settings.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'app/dependabot' &&
      github.event.pull_request.user.login != 'renovate' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'app/renovate' &&
      vars.OPENCODE_CODE_REVIEW_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      payload_artifact_id: ${{ steps.review.outputs.payload_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode OpenRouter review
        id: review
        uses: vouchington/vouchington-tooling/.github/actions/opencode-code-review@7226e68cfefeb5d60034a76186609387a82387d0 # vouchington-tooling-v0.1.4
        with:
          pr_number: ${{ github.event.pull_request.number }}
          provider_name: OpenCode OpenRouter
          trusted_prompt_ref: ${{ github.event.pull_request.base.sha }}
          model: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          payload_artifact_name: opencode-openrouter-${{ github.event.pull_request.head.sha }}
          openrouter_api_key: ${{ secrets.OPENROUTER_FREE_API_KEY }}

  opencode-openrouter-poster:
    name: OpenCode OpenRouter review poster
    needs: [opencode-openrouter-review]
    if: always() && needs.opencode-openrouter-review.outputs.payload_artifact_id != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Require the selected PR head before posting
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current" = "$SELECTED_HEAD_SHA" ] || {
            echo '::error::PR head changed before the review poster ran.'
            exit 1
          }
      - name: Post OpenCode OpenRouter review
        uses: vouchington/vouchington-tooling/.github/actions/code-review-poster@7226e68cfefeb5d60034a76186609387a82387d0 # vouchington-tooling-v0.1.4
        with:
          pr_number: ${{ github.event.pull_request.number }}
          artifact_id: ${{ needs.opencode-openrouter-review.outputs.payload_artifact_id }}
          provider_name: OpenCode OpenRouter
          token_source: github-token

  opencode-zen-review:
    name: OpenCode Zen review
    needs: [await-required-tests, validate-review-settings]
    if: >-
      needs.await-required-tests.result == 'success' &&
      needs.validate-review-settings.result == 'success' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'app/dependabot' &&
      github.event.pull_request.user.login != 'renovate' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'app/renovate' &&
      vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      payload_artifact_id: ${{ steps.review.outputs.payload_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode Zen review
        id: review
        uses: vouchington/vouchington-tooling/.github/actions/opencode-code-review@7226e68cfefeb5d60034a76186609387a82387d0 # vouchington-tooling-v0.1.4
        with:
          pr_number: ${{ github.event.pull_request.number }}
          provider_name: OpenCode Zen
          trusted_prompt_ref: ${{ github.event.pull_request.base.sha }}
          model: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
          payload_artifact_name: opencode-zen-${{ github.event.pull_request.head.sha }}
          opencode_api_key: ${{ secrets.OPENCODE_FREE_API_KEY }}

  opencode-zen-poster:
    name: OpenCode Zen review poster
    needs: [opencode-zen-review]
    if: always() && needs.opencode-zen-review.outputs.payload_artifact_id != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Require the selected PR head before posting
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current" = "$SELECTED_HEAD_SHA" ] || {
            echo '::error::PR head changed before the review poster ran.'
            exit 1
          }
      - name: Post OpenCode Zen review
        uses: vouchington/vouchington-tooling/.github/actions/code-review-poster@7226e68cfefeb5d60034a76186609387a82387d0 # vouchington-tooling-v0.1.4
        with:
          pr_number: ${{ github.event.pull_request.number }}
          artifact_id: ${{ needs.opencode-zen-review.outputs.payload_artifact_id }}
          provider_name: OpenCode Zen
          token_source: github-token

  code-reviewed:
    # This job name is a branch-protection invariant. Together with the workflow name above,
    # GitHub exposes the required native check as exactly: Final Code Review / Code Reviewed.
    name: Code Reviewed
    needs:
      - await-required-tests
      - validate-review-settings
      - opencode-openrouter-review
      - opencode-openrouter-poster
      - opencode-zen-review
      - opencode-zen-poster
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate the native gate
        env:
          TESTS_RESULT: ${{ needs.await-required-tests.result }}
          SETTINGS_RESULT: ${{ needs.validate-review-settings.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::The PR head is not a full commit SHA.'
            exit 1
          }
          current="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$current" = "$HEAD_SHA" ] || {
            echo "::error::Refusing to pass a stale Final Code Review gate: expected $HEAD_SHA, current $current."
            exit 1
          }
          [ "$TESTS_RESULT" = success ] || {
            echo '::error::The exact-head required test fan-in did not pass.'
            exit 1
          }

          trusted=true
          [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] || trusted=false
          case "$AUTHOR" in
            dependabot|dependabot\[bot\]|app/dependabot|renovate|renovate\[bot\]|app/renovate)
              trusted=false
              ;;
          esac
          if [ "$trusted" = true ] && [ "$DRAFT" = true ]; then
            echo '::notice::Draft PR: native gate is satisfied by exact-head CI; provider review waits until ready_for_review.'
          elif [ "$trusted" = true ]; then
            [ "$SETTINGS_RESULT" = success ] || {
              echo '::error::Trusted review settings did not validate.'
              exit 1
            }
            echo 'Trusted provider outcomes are advisory; exact-head CI and this native gate are authoritative.'
          else
            echo 'Fork and dependency-bot PR: no secrets or PR-controlled code were used; exact-head CI passed.'
          fi
