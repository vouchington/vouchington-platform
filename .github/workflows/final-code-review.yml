name: Final Code Review

on:
  repository_dispatch:
    types: [final-review-requested]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: final-code-review-${{ github.event.client_payload.pr_number }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: true

jobs:
  select-final-review:
    name: Select final review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_review: ${{ steps.select.outputs.should_review }}
      gate_status: ${{ steps.select.outputs.gate_status }}
      pr_number: ${{ steps.select.outputs.pr_number }}
      head_sha: ${{ steps.select.outputs.head_sha }}
      base_sha: ${{ steps.select.outputs.base_sha }}
    steps:
      - name: Select final review
        id: select
        uses: vouchington/vouchington-tooling/.github/actions/select-final-review@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          read-token: ${{ github.token }}
          pr-number: ${{ github.event.client_payload.pr_number }}
          event-action: ${{ github.event.action }}
          event-head-sha: ${{ github.event.client_payload.head_sha }}
          source-run-id: ${{ github.event.client_payload.source_run_id }}
          source-run-attempt: ${{ github.event.client_payload.source_run_attempt }}
          source-base-sha: ${{ github.event.client_payload.base_sha }}
          default-branch: ${{ github.event.repository.default_branch }}
          workflow-path: .github/workflows/ci.yml
          workflow-event: pull_request
          fan-in-job: tests

  validate-review-settings:
    name: Validate code review settings
    needs: [select-final-review]
    if: >-
      always() && needs.select-final-review.result == 'success' &&
      needs.select-final-review.outputs.gate_status != 'ignore' &&
      needs.select-final-review.outputs.gate_status != 'untrusted' &&
      needs.select-final-review.outputs.gate_status != 'stale' &&
      needs.select-final-review.outputs.gate_status != 'closed' &&
      needs.select-final-review.outputs.gate_status != 'deferred' &&
      needs.select-final-review.outputs.gate_status != 'base-stale'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate required organization variables
        env:
          OPENROUTER_ENABLED: ${{ vars.OPENCODE_CODE_REVIEW_ENABLED }}
          OPENROUTER_MODEL: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          ZEN_ENABLED: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED }}
          ZEN_MODEL: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          boolean() { case "$2" in true|false) ;; *) echo "::error::$1 must be exactly true or false"; exit 1;; esac; }
          boolean OPENCODE_CODE_REVIEW_ENABLED "$OPENROUTER_ENABLED"
          boolean OPENCODE_ZEN_CODE_REVIEW_ENABLED "$ZEN_ENABLED"
          if [ "$OPENROUTER_ENABLED" = true ]; then
            [ -n "$OPENROUTER_MODEL" ] || { echo '::error::OPENCODE_CODE_REVIEW_MODEL is required'; exit 1; }
          fi
          if [ "$ZEN_ENABLED" = true ]; then
            [ -n "$ZEN_MODEL" ] || { echo '::error::OPENCODE_ZEN_CODE_REVIEW_MODEL is required'; exit 1; }
          fi

  opencode-code-review:
    name: OpenCode OpenRouter Review
    needs: [select-final-review, validate-review-settings]
    if: >-
      needs.select-final-review.outputs.should_review == 'true' &&
      vars.OPENCODE_CODE_REVIEW_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action_outcome: ${{ steps.opencode-review-agent.outcome }}
      agent_outcome: ${{ steps.opencode-review-agent.outputs.agent_outcome }}
      payload_artifact_id: ${{ steps.opencode-review-agent.outputs.payload_artifact_id }}
    steps:
      - name: Require a live ready default-branch PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.select-final-review.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [ "$(jq -r '.head.sha' <<< "$pr_json")" = "$EXPECTED_HEAD_SHA" ]
          [ "$(jq -r '.base.sha' <<< "$pr_json")" = "$EXPECTED_BASE_SHA" ]
          [ "$(jq -r '.base.ref' <<< "$pr_json")" = "$DEFAULT_BRANCH" ]
          [ "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r '.draft' <<< "$pr_json")" = false ]
          [ "$(jq -r '.state' <<< "$pr_json")" = open ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-final-review.outputs.head_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Run OpenCode OpenRouter review
        id: opencode-review-agent
        uses: vouchington/vouchington-tooling/.github/actions/opencode-code-review@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          provider_name: OpenCode OpenRouter
          trusted_prompt_ref: ${{ needs.select-final-review.outputs.base_sha }}
          model: ${{ vars.OPENCODE_CODE_REVIEW_MODEL }}
          payload_artifact_name: opencode-openrouter
          openrouter_api_key: ${{ secrets.OPENROUTER_FREE_API_KEY }}
      - name: Require agent success
        if: >-
          always() && (steps.opencode-review-agent.outcome != 'success' ||
          steps.opencode-review-agent.outputs.agent_outcome != 'success')
        run: |
          echo '::error::OpenCode OpenRouter review did not complete successfully.'
          exit 1

  opencode-code-review-poster:
    name: OpenCode OpenRouter Review Poster
    needs: [select-final-review, opencode-code-review]
    if: always() && needs.opencode-code-review.outputs.payload_artifact_id != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      poster_outcome: ${{ steps.opencode-review-poster.outputs.poster_outcome }}
    steps:
      - name: Require the selected PR head before posting
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          SELECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
          SELECTED_BASE_SHA: ${{ needs.select-final-review.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [ "$(jq -r '.head.sha' <<< "$pr_json")" = "$SELECTED_HEAD_SHA" ]
          [ "$(jq -r '.base.sha' <<< "$pr_json")" = "$SELECTED_BASE_SHA" ]
          [ "$(jq -r '.base.ref' <<< "$pr_json")" = "$DEFAULT_BRANCH" ]
          [ "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r '.draft' <<< "$pr_json")" = false ]
          [ "$(jq -r '.state' <<< "$pr_json")" = open ]
      - name: Post OpenCode OpenRouter review
        id: opencode-review-poster
        uses: vouchington/vouchington-tooling/.github/actions/code-review-poster@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          artifact_id: ${{ needs.opencode-code-review.outputs.payload_artifact_id }}
          provider_name: OpenCode OpenRouter
          token_source: github-token
          expected_head_sha: ${{ needs.select-final-review.outputs.head_sha }}
          expected_base_sha: ${{ needs.select-final-review.outputs.base_sha }}
      - name: Require poster success
        if: >-
          always() && (steps.opencode-review-poster.outcome != 'success' ||
          steps.opencode-review-poster.outputs.poster_outcome != 'success')
        run: |
          echo '::error::OpenCode OpenRouter review poster did not complete successfully.'
          exit 1

  opencode-zen-code-review:
    name: OpenCode Zen Review
    needs: [select-final-review, validate-review-settings]
    if: >-
      needs.select-final-review.outputs.should_review == 'true' &&
      vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      action_outcome: ${{ steps.opencode-review-agent.outcome }}
      agent_outcome: ${{ steps.opencode-review-agent.outputs.agent_outcome }}
      payload_artifact_id: ${{ steps.opencode-review-agent.outputs.payload_artifact_id }}
    steps:
      - name: Require a live ready default-branch PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.select-final-review.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [ "$(jq -r '.head.sha' <<< "$pr_json")" = "$EXPECTED_HEAD_SHA" ]
          [ "$(jq -r '.base.sha' <<< "$pr_json")" = "$EXPECTED_BASE_SHA" ]
          [ "$(jq -r '.base.ref' <<< "$pr_json")" = "$DEFAULT_BRANCH" ]
          [ "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r '.draft' <<< "$pr_json")" = false ]
          [ "$(jq -r '.state' <<< "$pr_json")" = open ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-final-review.outputs.head_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Run OpenCode Zen review
        id: opencode-review-agent
        uses: vouchington/vouchington-tooling/.github/actions/opencode-code-review@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          provider_name: OpenCode Zen
          trusted_prompt_ref: ${{ needs.select-final-review.outputs.base_sha }}
          model: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_MODEL }}
          payload_artifact_name: opencode-zen
          opencode_api_key: ${{ secrets.OPENCODE_FREE_API_KEY }}
      - name: Require agent success
        if: >-
          always() && (steps.opencode-review-agent.outcome != 'success' ||
          steps.opencode-review-agent.outputs.agent_outcome != 'success')
        run: |
          echo '::error::OpenCode Zen review did not complete successfully.'
          exit 1

  opencode-zen-code-review-poster:
    name: OpenCode Zen Review Poster
    needs: [select-final-review, opencode-zen-code-review]
    if: always() && needs.opencode-zen-code-review.outputs.payload_artifact_id != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      poster_outcome: ${{ steps.opencode-review-poster.outputs.poster_outcome }}
    steps:
      - name: Require the selected PR head before posting
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          SELECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
          SELECTED_BASE_SHA: ${{ needs.select-final-review.outputs.base_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [ "$(jq -r '.head.sha' <<< "$pr_json")" = "$SELECTED_HEAD_SHA" ]
          [ "$(jq -r '.base.sha' <<< "$pr_json")" = "$SELECTED_BASE_SHA" ]
          [ "$(jq -r '.base.ref' <<< "$pr_json")" = "$DEFAULT_BRANCH" ]
          [ "$(jq -r '.base.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY" ]
          [ "$(jq -r '.draft' <<< "$pr_json")" = false ]
          [ "$(jq -r '.state' <<< "$pr_json")" = open ]
      - name: Post OpenCode Zen review
        id: opencode-review-poster
        uses: vouchington/vouchington-tooling/.github/actions/code-review-poster@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          artifact_id: ${{ needs.opencode-zen-code-review.outputs.payload_artifact_id }}
          provider_name: OpenCode Zen
          token_source: github-token
          expected_head_sha: ${{ needs.select-final-review.outputs.head_sha }}
          expected_base_sha: ${{ needs.select-final-review.outputs.base_sha }}
      - name: Require poster success
        if: >-
          always() && (steps.opencode-review-poster.outcome != 'success' ||
          steps.opencode-review-poster.outputs.poster_outcome != 'success')
        run: |
          echo '::error::OpenCode Zen review poster did not complete successfully.'
          exit 1

  code-reviewed:
    name: >-
      Code Reviewed
    needs:
      - select-final-review
      - validate-review-settings
      - opencode-code-review
      - opencode-code-review-poster
      - opencode-zen-code-review
      - opencode-zen-code-review-poster
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Validate final review outcome
        id: gate
        env:
          SELECT_RESULT: ${{ needs.select-final-review.result }}
          SETTINGS_RESULT: ${{ needs.validate-review-settings.result }}
          IS_DRAFT: 'false'
          EVENT_STATE: open
          EVENT_BASE_REF: ${{ github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GATE_STATUS: ${{ needs.select-final-review.outputs.gate_status }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.select-final-review.outputs.pr_number }}
          SELECTED_HEAD_SHA: ${{ needs.select-final-review.outputs.head_sha }}
          SELECTED_BASE_SHA: ${{ needs.select-final-review.outputs.base_sha }}
          CLAUDE_ENABLED: 'false'
          CLAUDE_RESULT: ''
          OPENROUTER_ENABLED: ${{ vars.OPENCODE_CODE_REVIEW_ENABLED }}
          OPENROUTER_ACTION: ${{ needs.opencode-code-review.outputs.action_outcome }}
          OPENROUTER_AGENT: ${{ needs.opencode-code-review.outputs.agent_outcome }}
          OPENROUTER_ARTIFACT: ${{ needs.opencode-code-review.outputs.payload_artifact_id }}
          OPENROUTER_POSTER: ${{ needs.opencode-code-review-poster.outputs.poster_outcome }}
          ZEN_ENABLED: ${{ vars.OPENCODE_ZEN_CODE_REVIEW_ENABLED }}
          ZEN_ACTION: ${{ needs.opencode-zen-code-review.outputs.action_outcome }}
          ZEN_AGENT: ${{ needs.opencode-zen-code-review.outputs.agent_outcome }}
          ZEN_ARTIFACT: ${{ needs.opencode-zen-code-review.outputs.payload_artifact_id }}
          ZEN_POSTER: ${{ needs.opencode-zen-code-review-poster.outputs.poster_outcome }}
          COMPLETE_LABEL: final-code-review:complete
          GH_RETRY_ATTEMPTS: '3'
          GH_RETRY_BACKOFF_SECONDS: '5'
          GH_RETRY_TRANSPORT_MARKERS: |
            net/http: TLS handshake timeout
            net/http: timeout awaiting response headers
            connection reset by peer
            unexpected EOF
            i/o timeout
        uses: vouchington/vouchington-tooling/.github/actions/final-review-gate@60c61e6f929913e4e06e30a2b80d7bf3addc0b63 # v0.3.5
        with:
          gate_status: ${{ needs.select-final-review.outputs.gate_status }}
          token: ${{ github.token }}
          pr_number: ${{ needs.select-final-review.outputs.pr_number }}
          selected_head_sha: ${{ needs.select-final-review.outputs.head_sha }}
          selected_base_sha: ${{ needs.select-final-review.outputs.base_sha }}
          default_branch: ${{ github.event.repository.default_branch }}
          complete_label: final-code-review:complete
          requested_label: final-code-review:requested
          check_name: Code Reviewed
