name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Enable eligible Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@c3731d3b7c773a5eadb9abb91a69763ec41de5d5 # v0.3.1
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

  cleanup-retargeted-automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Disable stale Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@c3731d3b7c773a5eadb9abb91a69763ec41de5d5 # v0.3.1
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
