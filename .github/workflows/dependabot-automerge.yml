name: Dependabot Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (github.event.pull_request.base.ref == github.event.repository.default_branch ||
      (github.event.action == 'edited' &&
      github.event.changes.base.ref.from == github.event.repository.default_branch)) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Enable eligible Dependabot auto-merge
        uses: vouchington/vouchington-tooling/.github/actions/dependabot-automerge@86b921c96d494e9f8ff6ee4cf7a652708557ca81 # v0.1.8
        with:
          automerge_token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
