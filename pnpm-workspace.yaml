packages:
  - packages/*
allowBuilds:
  '@jongleberry/vurst-html': true
  core-js: false
  esbuild: false
  protobufjs: false
disallowWorkspaceCycles: true
linkWorkspacePackages: true
# Hold third-party releases for 7 days, matching the Dependabot cooldown in
# dependabot.yml. First-party packages are exempt in both places.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@jongleberry/*'
  - '@vouchington/*'
  - ssrf-guard
  - valkyries
